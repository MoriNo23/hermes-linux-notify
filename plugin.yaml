name: hermes-linux-notify
version: "1.0.0"
description: "Linux desktop notification when Hermes CLI finishes responding, asks a question, or needs confirmation. Uses the native notifier via notify-send → stderr fallback."
author: opencode
kind: standalone
hooks:
  - post_llm_call
  - pre_tool_call
  - pre_approval_request
  - post_tool_call
  - post_approval_response

# Optional config (read by the plugin itself, ignored by Hermes core)
config:
  sound_enabled: true        # set false to disable the key-click
  sound_path: ""              # empty = use bundled sounds/keyclick.wav
  sound_volume: 100           # 0-100, applied only with paplay
  icon_path: ""               # empty = use bundled assets/icon-128.png
  notify_question: true       # notify when the model asks a question (clarify)
  notify_approval: true       # notify when user confirmation is required

# Visual-testing mirror (optional, NOT read by Hermes core):
# If HERMES_NOTIFY_MIRROR is set in the environment (e.g. http://localhost:8787/mirror),
# every notification is also POSTed to that URL as JSON for the Node dashboard.
# Unset = no mirror, zero overhead. See dashboard/README.md.
