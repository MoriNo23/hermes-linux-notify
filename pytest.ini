[pytest]
# Import test modules as files (importlib) so pytest never walks up and treats
# the repo root -- a Hermes plugin package with a real __init__.py -- as the
# importable parent of the tests. The plugin's notify_pkg/ package is reached via
# pythonpath instead. (The root __init__.py is also standalone-import-safe, see
# that file.)
addopts = --import-mode=importlib
testpaths = tests
pythonpath = .